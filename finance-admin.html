<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Admin — Umair TikTok Wala</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.3.0/dist/tabler-icons.min.css">
<style>
:root{
  --ink:#0F1222; --ink-2:#2A2F45;
  --bg:#F6F7FB; --card:#FFFFFF; --card-2:#F9FAFC;
  --muted:#8A90A6; --muted-2:#B4B9CC; --line:#ECEEF4;
  --blue:#3B5BFF; --purple:#8B31E8; --red:#F0333E;
  --green:#16B364; --amber:#F79009;
  --grad:linear-gradient(103deg,var(--blue) 0%,var(--purple) 52%,var(--red) 100%);
  --soft-blue:#EEF1FF; --soft-purple:#F7EEFE; --soft-green:#E7F9F0;
  --soft-amber:#FEF4E6; --soft-red:#FDECEC;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --shadow:0 1px 3px rgba(15,18,34,.04), 0 8px 24px rgba(15,18,34,.05);
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:var(--body)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

.splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:999}
.splash-dot{width:46px;height:46px;border-radius:50%;background:var(--grad);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.72);opacity:.5}50%{transform:scale(1);opacity:1}}

/* AUTH */
.auth{min-height:100vh;display:none;align-items:center;justify-content:center;padding:28px}
.af{width:100%;max-width:380px}
.af h2{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:-.025em;margin-bottom:6px}
.af-sub{color:var(--muted);font-size:14px;margin-bottom:28px}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;font-family:var(--body);font-size:15px;background:var(--card);color:var(--ink)}
.field input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 4px var(--soft-purple)}
.btn{width:100%;padding:14px;border:none;border-radius:99px;cursor:pointer;background:var(--grad);color:#fff;font-weight:700;font-size:15px;margin-top:8px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.note{padding:13px 15px;border-radius:11px;font-size:13.5px;margin-bottom:18px;display:none}
.note.show{display:block}
.note.bad{background:var(--soft-red);border:1px solid #FECACA;color:#991B1B}

/* SHELL */
#app{display:none}
.shell{display:grid;grid-template-columns:222px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-logo{padding:0 8px 22px}
.side-logo-t{font-family:var(--display);font-weight:800;font-size:15px;line-height:1.2}
.side-logo-t em{display:block;font-family:var(--mono);font-style:normal;font-weight:500;font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--purple);margin-top:2px}
.side-nav{display:flex;flex-direction:column;gap:3px;flex:1}
.snav{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;border:none;background:none;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);width:100%;text-align:left;transition:all .16s}
.snav i{font-size:18px}
.snav:hover{background:var(--card-2);color:var(--ink-2)}
.snav.on{background:var(--ink);color:#fff}
.snav .dot{margin-left:auto;min-width:20px;height:20px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 6px}
.snav .dot.show{display:flex}
.side-foot{padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.side-link{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:11px;background:var(--card-2);color:var(--ink-2);font-size:13px;font-weight:600}
.side-link:hover{background:var(--line)}
.side-link i{font-size:17px}

.main{min-width:0}
.topbar{position:sticky;top:0;z-index:40;background:rgba(246,247,251,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:15px 28px;display:flex;align-items:center;gap:16px}
.tb-title{flex:1;min-width:0}
.tb-title h1{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em;line-height:1.2}
.tb-title p{font-size:12.5px;color:var(--muted)}
.tb-btn{background:none;border:1.5px solid var(--line);border-radius:99px;padding:8px 15px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.tb-btn:hover{border-color:var(--ink);background:var(--card)}
.tb-btn i{font-size:15px}
.content{padding:24px 28px 70px}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:6px;padding:12px;overflow-x:auto}
  .side-logo,.side-foot{display:none}
  .side-nav{flex-direction:row;gap:6px}
  .snav{width:auto;white-space:nowrap;padding:9px 13px;font-size:13px}
  .topbar{padding:13px 16px}
  .content{padding:18px 16px 60px}
}

/* CARDS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow)}
.stat .n{font-family:var(--display);font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.stat .n.red{color:var(--red)} .stat .n.green{color:var(--green)} .stat .n.amber{color:var(--amber)}

.sec-h{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em;margin:0 0 14px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.bar input,.bar select{padding:9px 13px;border:1.5px solid var(--line);border-radius:10px;font-family:var(--body);font-size:13.5px;background:var(--card);color:var(--ink)}
.bar input{flex:1;min-width:200px}
.bar input:focus,.bar select:focus{outline:none;border-color:var(--purple)}
.seg{display:inline-flex;background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:none;background:none;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 14px;border-radius:99px}
.seg button.on{background:var(--ink);color:#fff}

.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);flex-wrap:wrap}
.row.warn{border-left:3px solid var(--red);border-radius:0 15px 15px 0}
.thumb{width:62px;height:62px;border-radius:9px;background:var(--soft-blue);color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;cursor:pointer;border:none;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb i{font-size:22px}
.thumb.none{background:var(--card-2);color:var(--muted-2);cursor:default}
.rmain{flex:1;min-width:180px}
.rt{font-weight:700;font-size:14.5px}
.rt small{font-weight:400;font-size:12px;color:var(--muted)}
.rm{font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:1px;word-break:break-all}
.rtags{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
.chip.ok{background:var(--soft-green);color:#0B7A47}
.chip.warn{background:var(--soft-red);color:#991B1B}
.chip.wait{background:var(--soft-amber);color:#92400E}
.chip.info{background:var(--soft-blue);color:#2B45C4}
.chip.plain{background:var(--card-2);color:var(--muted)}
.ramt{text-align:right;min-width:105px}
.ramt .a{font-family:var(--display);font-weight:800;font-size:17px}
.ramt .b{font-size:11.5px;color:var(--muted)}
.racts{display:flex;flex-direction:column;gap:5px}
.act{border:1.5px solid var(--line);background:none;border-radius:99px;padding:6px 14px;cursor:pointer;font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.act:hover{border-color:var(--ink);background:var(--card-2)}
.act.go{background:var(--green);border-color:var(--green);color:#fff}
.act.no{color:#991B1B;border-color:#FECACA}
.act:disabled{opacity:.5;cursor:not-allowed}

.empty{padding:52px 22px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:var(--r);font-size:14.5px}
.empty i{font-size:34px;color:var(--muted-2);display:block;margin-bottom:10px}
.loading{padding:44px;text-align:center;color:var(--muted);font-size:14px}

/* MODAL */
.sheet{position:fixed;inset:0;background:rgba(15,18,34,.6);z-index:150;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.sheet.show{display:flex}
.sbox{background:var(--card);border-radius:20px;width:100%;max-width:560px;padding:26px;box-shadow:0 20px 60px rgba(15,18,34,.24);margin:auto}
.sbox h3{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em;margin-bottom:4px}
.sbox .sub{font-size:13.5px;color:var(--muted);margin-bottom:20px}
.f{margin-bottom:15px}
.f label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.f input,.f select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;font-family:var(--body);font-size:15px;background:var(--card);color:var(--ink)}
.f input:focus{outline:none;border-color:var(--purple)}
.f .hint{font-size:12px;color:var(--muted);margin-top:5px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:20px;text-align:center;cursor:pointer;background:var(--card-2)}
.drop:hover{border-color:var(--purple);background:var(--soft-purple)}
.drop i{font-size:24px;color:var(--muted);display:block;margin-bottom:6px}
.drop .t{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.drop .s{font-size:12px;color:var(--muted);margin-top:3px}
.drop.has{border-style:solid;border-color:var(--green);background:var(--soft-green)}
.drop.has i,.drop.has .t{color:#0B7A47}
.sbtns{display:flex;gap:10px;margin-top:20px}
.sbtns button{flex:1;justify-content:center;padding:13px;border-radius:99px;border:1.5px solid var(--line);background:none;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink-2)}
.sbtns button.go{background:var(--grad);border-color:transparent;color:#fff}
.sbtns button:disabled{opacity:.55;cursor:not-allowed}
.smsg{padding:12px 14px;border-radius:11px;font-size:13px;margin-bottom:16px;display:none}
.smsg.show{display:block}
.smsg.bad{background:var(--soft-red);border:1px solid #FECACA;color:#991B1B}

/* STUDENT PROFILE */
.sp-top{display:flex;align-items:center;gap:15px;margin-bottom:20px}
.sp-av{width:70px;height:70px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:27px;color:#fff;flex-shrink:0;overflow:hidden}
.sp-av img{width:100%;height:100%;object-fit:cover}
.sp-name{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em;line-height:1.2}
.sp-sub{font-size:13px;color:var(--muted);margin-top:2px}
.sp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px}
.sp-stat{background:var(--card-2);border-radius:13px;padding:13px}
.sp-stat .n{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em}
.sp-stat .l{font-size:11px;color:var(--muted);margin-top:1px}
.sp-h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:20px 0 10px}
.sp-row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--card-2);font-size:13.5px}
.sp-row:last-child{border-bottom:none}
.sp-row span{color:var(--muted);flex-shrink:0}
.sp-row b{font-weight:600;text-align:right;word-break:break-all}
.sp-item{background:var(--card-2);border-radius:11px;padding:11px 13px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
.sp-item .m{font-family:var(--mono);font-size:11.5px;color:var(--muted);word-break:break-all}

/* LIGHTBOX */
.lb{position:fixed;inset:0;background:rgba(15,18,34,.88);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
.lb.show{display:flex}
.lb img{max-width:100%;max-height:88vh;border-radius:12px}
.lb-x{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.15);border:none;color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:19px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:300;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="splash" id="splash"><div class="splash-dot"></div></div>

<div class="auth" id="auth">
  <div class="af">
    <div class="note" id="note"></div>
    <h2>Finance Admin</h2>
    <p class="af-sub">Team access only.</p>
    <form id="loginForm">
      <div class="field">
        <label for="liNum">WhatsApp number</label>
        <input type="tel" id="liNum" name="username" placeholder="03001234567" autocomplete="username" inputmode="numeric">
      </div>
      <div class="field">
        <label for="liPw">Password</label>
        <input type="password" id="liPw" name="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="loginBtn">Log in</button>
    </form>
  </div>
</div>

<div id="app">
  <div class="shell">
    <aside class="side">
      <div class="side-logo">
        <div class="side-logo-t">Umair TikTok Wala<em>Finance Admin</em></div>
      </div>
      <nav class="side-nav" id="nav">
        <button class="snav on" data-s="overview"><i class="ti ti-layout-dashboard"></i> Overview</button>
        <button class="snav" data-s="claims"><i class="ti ti-photo-check"></i> Claims <span class="dot" id="dotClaims">0</span></button>
        <button class="snav" data-s="payouts"><i class="ti ti-cash"></i> Payouts</button>
        <button class="snav" data-s="methods"><i class="ti ti-building-bank"></i> Methods <span class="dot" id="dotMethods">0</span></button>
        <button class="snav" data-s="students"><i class="ti ti-users"></i> Students</button>
        <button class="snav" data-s="commission"><i class="ti ti-chart-line"></i> Commission</button>
      </nav>
      <div class="side-foot">
        <a class="side-link" href="finance.html"><i class="ti ti-wallet"></i> Student view</a>
        <a class="side-link" href="learn.html"><i class="ti ti-book-2"></i> Learning portal</a>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="tb-title">
          <h1 id="tbH">Overview</h1>
          <p id="tbP">Everything that needs your attention</p>
        </div>
        <button class="tb-btn" id="refreshBtn"><i class="ti ti-refresh"></i> Refresh</button>
        <button class="tb-btn" id="outBtn">Log out</button>
      </div>

      <div class="content">
        <div id="secOverview"></div>
        <div id="secClaims" style="display:none"></div>
        <div id="secPayouts" style="display:none"></div>
        <div id="secMethods" style="display:none"></div>
        <div id="secStudents" style="display:none"></div>
        <div id="secCommission" style="display:none"></div>
      </div>
    </main>
  </div>
</div>

<!-- MARK PAID + PROOF -->
<div class="sheet" id="paySheet">
  <div class="sbox" style="max-width:440px">
    <h3>Record this payment</h3>
    <p class="sub" id="payWho"></p>
    <div class="smsg" id="payMsg"></div>

    <div class="f">
      <label for="payAmount">Amount sent (PKR)</label>
      <input type="number" id="payAmount" step="1" min="0">
    </div>

    <div class="f">
      <label for="payBy">Sent by</label>
      <input type="text" id="payBy" placeholder="Who made the transfer">
    </div>

    <div class="f">
      <label>Payment proof</label>
      <div class="drop" id="payDrop">
        <i class="ti ti-receipt-2"></i>
        <div class="t">Attach the transfer receipt</div>
        <div class="s">JPG, PNG or WebP — up to 5 MB</div>
      </div>
      <input type="file" id="payFile" accept="image/jpeg,image/png,image/webp" style="display:none">
      <div class="hint">A receipt is required — it is the record if a payment is ever questioned.</div>
    </div>

    <div class="sbtns">
      <button id="payCancel">Cancel</button>
      <button class="go" id="payConfirm">Mark paid</button>
    </div>
  </div>
</div>

<!-- STUDENT PROFILE -->
<div class="sheet" id="stuSheet">
  <div class="sbox">
    <div id="stuBody"></div>
    <div class="sbtns">
      <button id="stuClose">Close</button>
    </div>
  </div>
</div>

<div class="lb" id="lb"><button class="lb-x" id="lbX">✕</button><img id="lbImg" alt="Payment proof"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
  setPersistence, browserLocalPersistence
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {
  getFirestore, doc, getDoc, updateDoc, collection, collectionGroup,
  query, where, getDocs, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {
  getStorage, ref as storageRef, uploadBytes, getDownloadURL
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';

const firebaseConfig = {
  apiKey: "AIzaSyAw6iJoyfQ2rUDC8GmFh5vXaTY0x6MWSxs",
  authDomain: "umair-tiktok-wala-academy.firebaseapp.com",
  projectId: "umair-tiktok-wala-academy",
  storageBucket: "umair-tiktok-wala-academy.firebasestorage.app",
  messagingSenderId: "389127998917",
  appId: "1:389127998917:web:a849ddb50e57f8787e4fac"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
const storage = getStorage(app);
setPersistence(auth, browserLocalPersistence).catch(()=>{});

/* ===== helpers ===== */
const $ = id => document.getElementById(id);
const note = $('note');
function say(m){ note.className='note show bad'; note.innerHTML=m; }
function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
function normalize(n){
  n=String(n||'').replace(/\D/g,'');
  if(n.startsWith('00'))  n=n.slice(2);
  if(n.startsWith('0'))   n='92'+n.slice(1);
  if(n.startsWith('920')) n='92'+n.slice(3);
  if(n.startsWith('3')&&n.length===10) n='92'+n;
  return n;
}
const usd = v => '$'+Number(v||0).toFixed(2);
const pkr = v => Number(v||0).toLocaleString('en-US');
function short(n){
  n=Number(n||0);
  if(n>=1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'')+'m';
  if(n>=1000)    return (n/1000).toFixed(0)+'k';
  return String(n);
}
function tsSec(v){
  if(!v) return 0;
  if(typeof v.seconds==='number') return v.seconds;
  if(typeof v==='number') return v;
  return 0;
}
function fmtDate(sec){
  if(!sec) return '';
  try{ return new Date(sec*1000).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
  catch(e){ return ''; }
}
function monthStartSec(){
  const d=new Date(); d.setDate(1); d.setHours(0,0,0,0);
  return Math.floor(d.getTime()/1000);
}
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ===== state ===== */
let ME=null;
let CLAIMS=[], SETTLEMENTS=[], METHODS=[], STUDENTS=[], ASSIGNMENTS=[], ENTRIES=[];
let LOADED=false;
let SECTION='overview';
let payoutTab='pending', payoutSort='low';
let studentQ='';

/* ===== login ===== */
$('loginForm').addEventListener('submit', async ev=>{
  ev.preventDefault();
  note.className='note';
  const num=normalize($('liNum').value), pw=$('liPw').value;
  const btn=$('loginBtn');
  if(num.length<11) return say('That number does not look right.');
  if(!pw) return say('Please enter your password.');
  btn.disabled=true; btn.textContent='Logging in…';
  try{
    const s=await getDoc(doc(db,'numbers',num));
    const email=s.exists() ? s.data().email : null;
    if(!email){
      btn.disabled=false; btn.textContent='Log in';
      return say('No account found for this number.');
    }
    await signInWithEmailAndPassword(auth, String(email).toLowerCase(), pw);
  }catch(e){
    btn.disabled=false; btn.textContent='Log in';
    say('Wrong number or password.');
  }
});

$('outBtn').onclick = ()=>signOut(auth);
$('refreshBtn').onclick = async ()=>{
  const b=$('refreshBtn'); b.disabled=true;
  LOADED=false;
  await loadAll();
  render();
  b.disabled=false;
  toast('Updated');
};

/* ===== screens ===== */
function showAuth(){ $('splash').style.display='none'; $('auth').style.display='flex'; $('app').style.display='none'; }
function showApp(){ $('splash').style.display='none'; $('auth').style.display='none'; $('app').style.display='block'; }

/* ===== data ===== */
async function grabAll(col){
  try{
    const snap=await getDocs(collection(db,col));
    const out=[]; snap.forEach(d=>out.push({id:d.id, ...d.data()})); return out;
  }catch(e){ console.error('read '+col, e); return []; }
}

async function loadAll(){
  if(LOADED) return;

  const [claims, settlements, students, assignments, entries] = await Promise.all([
    grabAll('paymentClaims'),
    grabAll('settlements'),
    grabAll('financeStudents'),
    grabAll('paypalAssignments'),
    grabAll('paymentEntries')
  ]);

  CLAIMS = claims.map(d=>({
    id:d.id,
    studentUid:d.studentUid||'',
    studentName:d.studentName||'',
    studentPhone:d.studentPhone||'',
    paypalEmail:d.paypalEmail||d.currentEmail||'',
    netUsd:Number(d.netUsd||0),
    status:String(d.status||'submitted').toLowerCase(),
    proofUrl:d.proofUrl||d.paymentProofUrl||'',
    matchNote:d.matchNote||'',
    at:tsSec(d.createdAt)
  })).sort((a,b)=>b.at-a.at);

  SETTLEMENTS = settlements.map(d=>({
    id:d.id,
    studentUid:d.studentUid||'',
    studentName:d.studentName||'',
    cycleId:d.cycleId||'',
    verifiedUsd:Number(d.verifiedUsd||0),
    payablePkr:Number(d.payablePkr||0),
    paidPkr:Number(d.paidPkr||0),
    pendingPkr:Number(d.pendingPkr||0),
    status:String(d.status||'pending').toLowerCase(),
    provider:d.paymentProviderSnapshot||'',
    accountTitle:d.paymentAccountTitleSnapshot||'',
    masked:d.paymentIdentifierMaskedSnapshot||'',
    at:tsSec(d.createdAt),
    paidAt:tsSec(d.paidAt),
    paidBy:d.paidBy||'',
    proofUrl:d.paymentProofUrl||''
  }));

  STUDENTS = students.map(d=>({
    uid:d.id,
    name:d.name||'',
    phone:d.phone||'',
    email:d.email||'',
    city:d.city||'',
    status:String(d.status||'').toLowerCase(),
    enabled:d.enabled===true
  }));

  ASSIGNMENTS = assignments.map(d=>({
    id:d.id,
    paypalId:d.paypalId||'',
    email:d.currentEmail||'',
    studentUid:d.studentUid||'',
    studentName:d.studentName||'',
    status:String(d.status||'linked').toLowerCase()
  }));

  ENTRIES = entries.map(d=>({
    id:d.id,
    cycleId:d.cycleId||'',
    studentUid:d.studentUid||'',
    commissionUsd:Number(d.commissionUsd||0),
    netUsd:Number(d.netUsd||0),
    at:tsSec(d.paymentDate)||tsSec(d.createdAt)
  }));

  METHODS = await loadMethods();
  LOADED = true;
}

async function loadMethods(){
  try{
    const snap=await getDocs(collectionGroup(db,'paymentMethods'));
    const out=[];
    snap.forEach(d=>{
      const data=d.data()||{};
      const uid = d.ref.parent.parent ? d.ref.parent.parent.id : (data.studentUid||'');
      out.push({
        id:d.id, path:d.ref.path, uid,
        type:data.type||'', provider:data.provider||'',
        accountTitle:data.accountTitle||'',
        identifier:data.accountIdentifier||'',
        last4:data.last4||'',
        isPrimary:data.isPrimary===true,
        status:String(data.status||'active').toLowerCase(),
        at:tsSec(data.updatedAt)
      });
    });
    return out;
  }catch(e){
    console.error('paymentMethods collectionGroup failed', e);
    return [];
  }
}

function studentName(uid, fallback){
  if(fallback) return fallback;
  const s=STUDENTS.find(x=>x.uid===uid);
  return s ? (s.name||uid) : uid;
}
function studentPhone(uid){
  const s=STUDENTS.find(x=>x.uid===uid);
  return s ? s.phone : '';
}

/* ===== actions ===== */
async function setClaim(id, status){
  try{
    await updateDoc(doc(db,'paymentClaims',id), { status, reviewedAt: serverTimestamp() });
    const c=CLAIMS.find(x=>x.id===id); if(c) c.status=status;
    render();
    toast(status==='verified' ? 'Claim approved' : 'Claim rejected');
  }catch(e){ toast('Could not save — try again'); }
}

/* ===== mark paid — proof lazmi ===== */
let payTarget=null, payFile=null;

function openPaySheet(id){
  const s = SETTLEMENTS.find(x=>x.id===id);
  if(!s) return;

  payTarget = s;
  payFile = null;

  $('payWho').textContent =
    studentName(s.studentUid, s.studentName)
    + ' · ' + [s.provider, s.accountTitle, s.masked].filter(Boolean).join(' · ');
  $('payAmount').value = s.pendingPkr || s.payablePkr;
  $('payBy').value = '';

  const d=$('payDrop');
  d.classList.remove('has');
  d.querySelector('i').className='ti ti-receipt-2';
  d.querySelector('.t').textContent='Attach the transfer receipt';
  d.querySelector('.s').textContent='JPG, PNG or WebP — up to 5 MB';

  $('payMsg').className='smsg';
  $('paySheet').classList.add('show');
}

$('payCancel').onclick = ()=>$('paySheet').classList.remove('show');
$('paySheet').onclick = e=>{ if(e.target.id==='paySheet') $('paySheet').classList.remove('show'); };
$('payDrop').onclick = ()=>$('payFile').click();

$('payFile').onchange = ev=>{
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;

  if(file.size > 5*1024*1024){
    $('payMsg').className='smsg show bad';
    $('payMsg').textContent='That image is too large. Please choose one under 5 MB.';
    ev.target.value=''; return;
  }

  payFile = file;
  $('payMsg').className='smsg';

  const d=$('payDrop');
  d.classList.add('has');
  d.querySelector('i').className='ti ti-circle-check';
  d.querySelector('.t').textContent='Receipt ready';
  d.querySelector('.s').textContent=file.name;
};

$('payConfirm').onclick = async ()=>{
  if(!payTarget) return;

  const amount = Number($('payAmount').value);
  const by     = $('payBy').value.trim();
  const btn    = $('payConfirm');

  if(!amount || amount<=0){
    $('payMsg').className='smsg show bad';
    $('payMsg').textContent='Please enter the amount that was sent.';
    return;
  }
  if(!payFile){
    $('payMsg').className='smsg show bad';
    $('payMsg').textContent='Please attach the transfer receipt.';
    return;
  }

  btn.disabled=true; btn.textContent='Saving…';

  try{
    const ext  = (payFile.type.split('/')[1]||'jpg').replace('jpeg','jpg');
    const path = 'payment-proofs/'+payTarget.studentUid+'/'+payTarget.id+'_'+Date.now()+'.'+ext;
    const fileRef = storageRef(storage, path);

    await uploadBytes(fileRef, payFile, { contentType: payFile.type });
    const proofUrl = await getDownloadURL(fileRef);

    await updateDoc(doc(db,'settlements',payTarget.id), {
      status:'paid',
      paidPkr: Math.round(amount),
      pendingPkr: Math.max((payTarget.payablePkr||0) - Math.round(amount), 0),
      paidAt: serverTimestamp(),
      paidBy: by,
      paymentProofUrl: proofUrl
    });

    payTarget.status='paid';
    payTarget.paidPkr=Math.round(amount);
    payTarget.pendingPkr=Math.max((payTarget.payablePkr||0)-Math.round(amount),0);
    payTarget.paidAt=Math.floor(Date.now()/1000);
    payTarget.proofUrl=proofUrl;

    $('paySheet').classList.remove('show');
    render();
    toast('Payment recorded');
  }catch(e){
    console.error(e);
    $('payMsg').className='smsg show bad';
    $('payMsg').textContent='Could not save. Check your connection and try again.';
  }

  btn.disabled=false; btn.textContent='Mark paid';
};

async function setMethod(path, status){
  try{
    const parts=path.split('/');
    await updateDoc(doc(db, parts[0], parts[1], parts[2], parts[3]), { status, updatedAt: serverTimestamp() });
    const m=METHODS.find(x=>x.path===path); if(m) m.status=status;
    render();
    toast(status==='active' ? 'Method approved' : 'Method rejected');
  }catch(e){ toast('Could not save — try again'); }
}

async function openStudent(uid){
  $('stuBody').innerHTML = '<div class="loading">Loading…</div>';
  $('stuSheet').classList.add('show');

  const fin = STUDENTS.find(s=>s.uid===uid) || {};
  let core = {};

  try{
    const snap = await getDoc(doc(db,'students',uid));
    if(snap.exists()) core = snap.data();
  }catch(e){ console.error(e); }

  const mine     = SETTLEMENTS.filter(s=>s.studentUid===uid);
  const lifetime = mine.reduce((a,s)=>a+s.payablePkr,0);
  const paid     = mine.filter(s=>s.status==='paid').reduce((a,s)=>a+s.paidPkr,0);
  const owed     = mine.filter(s=>s.status!=='paid').reduce((a,s)=>a+(s.pendingPkr||s.payablePkr),0);
  const usdTotal = mine.reduce((a,s)=>a+s.verifiedUsd,0);

  const accounts = ASSIGNMENTS.filter(a=>a.studentUid===uid);
  const methods  = METHODS.filter(m=>m.uid===uid && m.status!=='inactive');
  const claims   = CLAIMS.filter(c=>c.studentUid===uid);

  const joined = core.joined && core.joined.seconds
    ? new Date(core.joined.seconds*1000).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})
    : '—';

  const name = fin.name || core.name || '(no name)';
  const photo = core.photoUrl || '';

  let h = '<div class="sp-top">'
    + '<div class="sp-av">'
      + (photo ? '<img src="'+esc(photo)+'" alt="">' : esc((name[0]||'S').toUpperCase()))
    + '</div>'
    + '<div><div class="sp-name">'+esc(name)+'</div>'
      + '<div class="sp-sub">'+esc(fin.phone||core.number||'')+'</div></div>'
  + '</div>';

  h += '<div class="sp-stats">'
    + '<div class="sp-stat"><div class="n">'+usd(usdTotal)+'</div><div class="l">Total USD</div></div>'
    + '<div class="sp-stat"><div class="n">PKR '+short(paid)+'</div><div class="l">Paid out</div></div>'
    + '<div class="sp-stat"><div class="n" style="color:'+(owed?'var(--amber)':'var(--green)')+'">PKR '+short(owed)+'</div><div class="l">Owed</div></div>'
  + '</div>';

  h += '<div class="sp-h">Details</div>'
    + row_('Email', fin.email || core.email || '—')
    + row_('City', fin.city || core.city || '—')
    + row_('Member since', joined)
    + row_('Service status', fin.status || '—')
    + row_('Student ID', 'UTW-'+uid.slice(-8).toUpperCase())
    + row_('Lifetime earned', 'PKR '+pkr(lifetime));

  h += '<div class="sp-h">PayPal accounts ('+accounts.length+')</div>';
  h += accounts.length ? accounts.map(a=>{
      const ended = a.status==='ended' || a.status==='unlinked';
      const cls = ended ? 'plain' : (a.status==='limited' ? 'warn' : 'ok');
      return '<div class="sp-item"><div><div class="m">'+esc(a.email||'—')+'</div></div>'
        + '<span class="chip '+cls+'">'+esc(titleCase(a.status))+'</span></div>';
    }).join('')
    : '<div class="sp-item"><span style="color:var(--muted)">No PayPal linked yet</span></div>';

  h += '<div class="sp-h">Where payouts go ('+methods.length+')</div>';
  h += methods.length ? methods.map(m=>
      '<div class="sp-item">'
      + '<div><b>'+esc(m.provider)+'</b>'
        + '<div class="m">'+esc(m.accountTitle)+' · '+esc(m.identifier||('•••• '+m.last4))+'</div></div>'
      + '<span class="chip '+(m.status==='active'?(m.isPrimary?'info':'plain'):'wait')+'">'
        + (m.status==='active' ? (m.isPrimary?'Primary':'Backup') : 'Pending review') + '</span>'
      + '</div>'
    ).join('')
    : '<div class="sp-item"><span style="color:var(--muted)">No payment method added yet</span></div>';

  h += '<div class="sp-h">Payments ('+mine.length+')</div>';
  h += mine.length ? mine.slice(0,12).map(s=>
      '<div class="sp-item">'
      + '<div><b>PKR '+pkr(s.status==='paid'?s.paidPkr:(s.pendingPkr||s.payablePkr))+'</b>'
        + '<div class="m">'+usd(s.verifiedUsd)+(s.cycleId?' · '+esc(s.cycleId):'')
        + ' · '+esc(fmtDate(s.status==='paid'?s.paidAt:s.at))+'</div></div>'
      + (s.proofUrl
          ? '<button class="act" data-img="'+esc(s.proofUrl)+'">Receipt</button>'
          : '<span class="chip '+(s.status==='paid'?'ok':'wait')+'">'+(s.status==='paid'?'Paid':'Pending')+'</span>')
      + '</div>'
    ).join('')
    : '<div class="sp-item"><span style="color:var(--muted)">No payment recorded yet</span></div>';

  if(claims.length){
    h += '<div class="sp-h">Claims ('+claims.length+')</div>';
    h += claims.slice(0,8).map(c=>
      '<div class="sp-item">'
      + '<div><b>'+usd(c.netUsd)+'</b><div class="m">'+esc(c.paypalEmail||'')+' · '+esc(fmtDate(c.at))+'</div></div>'
      + (c.proofUrl ? '<button class="act" data-img="'+esc(c.proofUrl)+'">Screenshot</button>' : '')
      + '</div>'
    ).join('');
  }

  $('stuBody').innerHTML = h;

  $('stuBody').querySelectorAll('[data-img]').forEach(b=>{
    b.onclick = ()=>{ $('lbImg').src=b.dataset.img; $('lb').classList.add('show'); };
  });
}

function row_(label, value){
  return '<div class="sp-row"><span>'+esc(label)+'</span><b>'+esc(value)+'</b></div>';
}

/* ===== render ===== */
const TITLES={
  overview:['Overview','Everything that needs your attention'],
  claims:['Claims','Payment claims waiting for review'],
  payouts:['Payouts','Who to pay, and who has been paid'],
  methods:['Methods','Bank and wallet details to review'],
  students:['Students','Search anyone on the service'],
  commission:['Commission','What the service earned']
};

function render(){
  const pendingClaims = CLAIMS.filter(c=>c.status==='submitted'||c.status==='under_review');
  const pendingMethods = METHODS.filter(m=>m.status==='pending_review');
  const unpaid = SETTLEMENTS.filter(s=>s.status!=='paid');
  const unpaidPkr = unpaid.reduce((a,s)=>a+(s.pendingPkr||s.payablePkr||0),0);

  const mStart = monthStartSec();
  const paidThisMonth = SETTLEMENTS
    .filter(s=>s.status==='paid' && s.paidAt>=mStart)
    .reduce((a,s)=>a+s.paidPkr,0);

  const conflicts = pendingClaims.filter(c=>c.status==='under_review').length;

  setDot('dotClaims', pendingClaims.length);
  setDot('dotMethods', pendingMethods.length);

  $('secOverview').innerHTML = renderOverview(pendingClaims, conflicts, unpaidPkr, paidThisMonth, unpaid);
  $('secClaims').innerHTML = renderClaims(pendingClaims);
  $('secPayouts').innerHTML = renderPayouts();
  $('secMethods').innerHTML = renderMethods(pendingMethods);
  $('secStudents').innerHTML = renderStudents();
  $('secCommission').innerHTML = renderCommission();

  wire();
}

function setDot(id, n){
  const el=$(id); if(!el) return;
  el.textContent=n; el.classList.toggle('show', n>0);
}

function renderOverview(pendingClaims, conflicts, unpaidPkr, paidThisMonth, unpaid){
  let h = '<div class="stats">'
    + stat(pendingClaims.length, 'Claims waiting', pendingClaims.length?'amber':'')
    + stat(conflicts, 'Conflicts', conflicts?'red':'')
    + stat('PKR '+short(unpaidPkr), 'Unpaid', '')
    + stat('PKR '+short(paidThisMonth), 'Paid this month', 'green')
    + '</div>';

  h += '<h3 class="sec-h">Next payouts</h3>';
  const next = unpaid.slice().sort((a,b)=>(a.pendingPkr||a.payablePkr)-(b.pendingPkr||b.payablePkr)).slice(0,5);
  h += next.length ? '<div class="list">'+next.map(payoutRow).join('')+'</div>'
                   : empty('ti-cash','Nothing pending right now.');
  return h;
}

function stat(n, l, cls){
  return '<div class="stat"><div class="n '+(cls||'')+'">'+esc(n)+'</div><div class="l">'+esc(l)+'</div></div>';
}

function renderClaims(list){
  if(!list.length) return empty('ti-photo-check','No claim is waiting for review.');
  const sorted = list.slice().sort((a,b)=>{
    const ax = a.status==='under_review'?0:1, bx = b.status==='under_review'?0:1;
    return ax-bx || b.at-a.at;
  });
  return '<div class="list">'+sorted.map(claimRow).join('')+'</div>';
}

function claimRow(c){
  const conflict = c.status==='under_review';
  const thumb = c.proofUrl
    ? '<button class="thumb" data-img="'+esc(c.proofUrl)+'"><img src="'+esc(c.proofUrl)+'" alt="Proof"></button>'
    : '<div class="thumb none"><i class="ti ti-photo-off"></i></div>';

  return '<div class="row'+(conflict?' warn':'')+'">'
    + thumb
    + '<div class="rmain">'
      + '<div class="rt">'+esc(studentName(c.studentUid,c.studentName))
        + ' <small>'+esc(c.studentPhone||studentPhone(c.studentUid))+'</small></div>'
      + '<div class="rm">'+esc(c.paypalEmail||'PayPal email not given')+'</div>'
      + '<div class="rtags">'
        + (conflict
            ? '<span class="chip warn">'+esc(c.matchNote||'Needs a manual check')+'</span>'
            : '<span class="chip ok">Matched</span>')
        + '<span class="chip plain">'+esc(fmtDate(c.at))+'</span>'
      + '</div>'
    + '</div>'
    + '<div class="ramt"><div class="a">'+usd(c.netUsd)+'</div></div>'
    + '<div class="racts">'
      + '<button class="act go" data-claim="'+esc(c.id)+'" data-to="verified">Approve</button>'
      + '<button class="act no" data-claim="'+esc(c.id)+'" data-to="rejected">Reject</button>'
    + '</div>'
  + '</div>';
}

function renderPayouts(){
  const isPending = payoutTab==='pending';
  let list = SETTLEMENTS.filter(s=> isPending ? s.status!=='paid' : s.status==='paid');

  list = list.slice().sort((a,b)=>{
    const av = isPending ? (a.pendingPkr||a.payablePkr) : a.paidPkr;
    const bv = isPending ? (b.pendingPkr||b.payablePkr) : b.paidPkr;
    return payoutSort==='low' ? av-bv : bv-av;
  });

  let h = '<div class="bar">'
    + '<div class="seg" id="payTabs">'
      + '<button data-t="pending" class="'+(isPending?'on':'')+'">Pending</button>'
      + '<button data-t="paid" class="'+(!isPending?'on':'')+'">Paid</button>'
    + '</div>'
    + '<select id="paySort">'
      + '<option value="low"'+(payoutSort==='low'?' selected':'')+'>Lowest PKR first</option>'
      + '<option value="high"'+(payoutSort==='high'?' selected':'')+'>Highest PKR first</option>'
    + '</select>'
    + '<span style="font-size:13px;color:var(--muted)">'+list.length+' records</span>'
    + '</div>';

  h += list.length ? '<div class="list">'+list.map(payoutRow).join('')+'</div>'
                   : empty('ti-cash', isPending?'Nothing pending.':'No payment recorded yet.');
  return h;
}

function payoutRow(s){
  const isPaid = s.status==='paid';
  const amount = isPaid ? s.paidPkr : (s.pendingPkr||s.payablePkr);
  const dest = [s.provider, s.accountTitle, s.masked].filter(Boolean).join(' · ');

  return '<div class="row">'
    + '<div class="thumb '+(isPaid?'':'none')+'" style="'+(isPaid?'background:var(--soft-green);color:#0B7A47':'')+'">'
      + '<i class="ti ti-'+(isPaid?'circle-check':'clock-hour-4')+'"></i></div>'
    + '<div class="rmain">'
      + '<div class="rt">'+esc(studentName(s.studentUid,s.studentName))
        + ' <small>'+esc(studentPhone(s.studentUid))+'</small></div>'
      + '<div class="rm">'+esc(dest||'No payment method on file')+'</div>'
      + '<div class="rtags">'
        + '<span class="chip '+(isPaid?'ok':'wait')+'">'+(isPaid?'Paid':'Pending')+'</span>'
        + (s.cycleId?'<span class="chip plain">'+esc(s.cycleId)+'</span>':'')
        + '<span class="chip plain">'+usd(s.verifiedUsd)+'</span>'
      + '</div>'
    + '</div>'
    + '<div class="ramt"><div class="a">PKR '+pkr(amount)+'</div>'
      + '<div class="b">'+esc(isPaid?fmtDate(s.paidAt):fmtDate(s.at))+'</div></div>'
    + (isPaid
        ? (s.proofUrl ? '<div class="racts"><button class="act" data-img="'+esc(s.proofUrl)+'">Receipt</button></div>' : '')
        : '<div class="racts"><button class="act go" data-paid="'+esc(s.id)+'">Mark paid</button></div>')
  + '</div>';
}

function renderMethods(list){
  if(!list.length) return empty('ti-building-bank','No payment method is waiting for review.');
  return '<div class="list">'+list.map(m=>
    '<div class="row">'
    + '<div class="thumb none" style="background:var(--soft-blue);color:var(--blue)"><i class="ti ti-building-bank"></i></div>'
    + '<div class="rmain">'
      + '<div class="rt">'+esc(studentName(m.uid))+' <small>'+esc(studentPhone(m.uid))+'</small></div>'
      + '<div class="rm">'+esc(m.provider)+' · '+esc(m.accountTitle)+' · '+esc(m.identifier||('•••• '+m.last4))+'</div>'
      + '<div class="rtags">'
        + '<span class="chip wait">Pending review</span>'
        + (m.isPrimary?'<span class="chip info">Primary</span>':'')
        + '<span class="chip plain">'+esc(fmtDate(m.at))+'</span>'
      + '</div>'
    + '</div>'
    + '<div class="racts">'
      + '<button class="act go" data-method="'+esc(m.path)+'" data-to="active">Approve</button>'
      + '<button class="act no" data-method="'+esc(m.path)+'" data-to="rejected">Reject</button>'
    + '</div>'
    + '</div>'
  ).join('')+'</div>';
}

function renderStudents(){
  const q = studentQ.trim().toLowerCase();
  let list = STUDENTS.filter(s=>s.enabled);

  if(q){
    const qNum = normalize(q);
    list = list.filter(s=>{
      if((s.name||'').toLowerCase().includes(q)) return true;
      if((s.email||'').toLowerCase().includes(q)) return true;
      if(qNum.length>=4 && normalize(s.phone).includes(qNum)) return true;
      const mine = ASSIGNMENTS.filter(a=>a.studentUid===s.uid);
      return mine.some(a=>(a.email||'').toLowerCase().includes(q));
    });
  }

  let h = '<div class="bar">'
    + '<input id="stuSearch" type="search" placeholder="Search by name, number or PayPal email" value="'+esc(studentQ)+'">'
    + '<span style="font-size:13px;color:var(--muted)">'+list.length+' active</span>'
    + '</div>';

  if(!list.length) return h + empty('ti-users','Nobody matches that search.');

  h += '<div class="list">'+list.slice(0,60).map(s=>{
    const mine = SETTLEMENTS.filter(x=>x.studentUid===s.uid);
    const lifetime = mine.reduce((a,x)=>a+x.payablePkr,0);
    const owed = mine.filter(x=>x.status!=='paid').reduce((a,x)=>a+(x.pendingPkr||x.payablePkr),0);
    const emails = ASSIGNMENTS.filter(a=>a.studentUid===s.uid && a.status!=='ended').map(a=>a.email).filter(Boolean);

    return '<div class="row" data-student="'+esc(s.uid)+'" style="cursor:pointer">'
      + '<div class="thumb none" style="background:var(--soft-purple);color:var(--purple)"><i class="ti ti-user"></i></div>'
      + '<div class="rmain">'
        + '<div class="rt">'+esc(s.name||'(no name)')+' <small>'+esc(s.phone)+'</small></div>'
        + '<div class="rm">'+esc(emails.length?emails.join(', '):'No PayPal linked')+'</div>'
        + '<div class="rtags">'
          + '<span class="chip plain">'+mine.length+' payments</span>'
          + (owed?'<span class="chip wait">PKR '+pkr(owed)+' owed</span>':'<span class="chip ok">Nothing owed</span>')
          + (s.city?'<span class="chip plain">'+esc(s.city)+'</span>':'')
        + '</div>'
      + '</div>'
      + '<div class="ramt"><div class="a">PKR '+short(lifetime)+'</div><div class="b">lifetime</div></div>'
      + '<div class="racts"><button class="act">Open</button></div>'
    + '</div>';
  }).join('')+'</div>';

  if(list.length>60) h += '<p style="font-size:13px;color:var(--muted);margin-top:14px">Showing the first 60. Narrow the search to see the rest.</p>';
  return h;
}

function renderCommission(){
  if(!ENTRIES.length){
    return empty('ti-chart-line','No payment entries have reached Firebase yet.');
  }

  const byCycle={};
  ENTRIES.forEach(e=>{
    const k=e.cycleId||'(no cycle)';
    byCycle[k]=(byCycle[k]||0)+e.commissionUsd;
  });

  const total = ENTRIES.reduce((a,e)=>a+e.commissionUsd,0);
  const mStart = monthStartSec();
  const thisMonth = ENTRIES.filter(e=>e.at>=mStart).reduce((a,e)=>a+e.commissionUsd,0);
  const volume = ENTRIES.reduce((a,e)=>a+e.netUsd,0);

  let h = '<div class="stats">'
    + stat(usd(total), 'Commission — all time', 'green')
    + stat(usd(thisMonth), 'This month', '')
    + stat(usd(volume), 'Payments handled', '')
    + stat(ENTRIES.length, 'Entries', '')
    + '</div>';

  h += '<h3 class="sec-h">By cycle</h3><div class="list">';
  Object.keys(byCycle).sort().reverse().forEach(k=>{
    h += '<div class="row">'
      + '<div class="thumb none" style="background:var(--soft-green);color:#0B7A47"><i class="ti ti-calendar"></i></div>'
      + '<div class="rmain"><div class="rt">'+esc(k)+'</div></div>'
      + '<div class="ramt"><div class="a">'+usd(byCycle[k])+'</div></div>'
      + '</div>';
  });
  h += '</div>';
  return h;
}

function empty(icon,msg){
  return '<div class="empty"><i class="ti '+icon+'"></i>'+esc(msg)+'</div>';
}

/* ===== events ===== */
function wire(){
  document.querySelectorAll('[data-claim]').forEach(b=>{
    b.onclick = ()=>{ b.disabled=true; setClaim(b.dataset.claim, b.dataset.to); };
  });
  document.querySelectorAll('[data-paid]').forEach(b=>{
    b.onclick = ()=> openPaySheet(b.dataset.paid);
  });
  document.querySelectorAll('[data-student]').forEach(b=>{
    b.onclick = ()=> openStudent(b.dataset.student);
  });
  document.querySelectorAll('[data-method]').forEach(b=>{
    b.onclick = ()=>{ b.disabled=true; setMethod(b.dataset.method, b.dataset.to); };
  });
  document.querySelectorAll('[data-img]').forEach(b=>{
    b.onclick = ()=>{ $('lbImg').src=b.dataset.img; $('lb').classList.add('show'); };
  });

  const tabs=$('payTabs');
  if(tabs) tabs.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{ payoutTab=b.dataset.t; render(); };
  });
  const sort=$('paySort');
  if(sort) sort.onchange=()=>{ payoutSort=sort.value; render(); };

  const search=$('stuSearch');
  if(search){
    search.oninput=()=>{
      studentQ=search.value;
      $('secStudents').innerHTML=renderStudents();
      wire();
      const s=$('stuSearch');
      if(s){ s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    };
  }
}

$('lbX').onclick = ()=>$('lb').classList.remove('show');
$('lb').onclick = e=>{ if(e.target.id==='lb') $('lb').classList.remove('show'); };

document.querySelectorAll('#nav .snav').forEach(b=>{
  b.onclick=()=>{
    SECTION=b.dataset.s;
    ['Overview','Claims','Payouts','Methods','Students','Commission'].forEach(k=>{
      $('sec'+k).style.display = (k.toLowerCase()===SECTION)?'block':'none';
    });
    document.querySelectorAll('#nav .snav').forEach(x=>x.classList.toggle('on', x.dataset.s===SECTION));
    const t=TITLES[SECTION]||TITLES.overview;
    $('tbH').textContent=t[0]; $('tbP').textContent=t[1];
    window.scrollTo({top:0,behavior:'smooth'});
  };
});

/* ===== boot ===== */
onAuthStateChanged(auth, async user=>{
  if(!user){ showAuth(); return; }

  let isAdmin=false;
  try{
    const a=await getDoc(doc(db,'admins',user.uid));
    isAdmin = a.exists();
  }catch(e){ isAdmin=false; }

  if(!isAdmin){
    await signOut(auth);
    showAuth();
    return say('This account does not have finance admin access.');
  }

  ME={uid:user.uid};
  showApp();
  $('secOverview').innerHTML='<div class="loading">Loading…</div>';
  await loadAll();
  render();
});
</script>
